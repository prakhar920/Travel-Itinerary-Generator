{% extends "headers.html" %}
{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

<div class="d-flex flex-column min-vh-100">
  <main class="flex-grow-1 container my-5">
    <div class="row justify-content-center">
      <div  class="p-3 mb-2 bg-primary-subtle text-primary-emphasis" >
        <h1 class="text-center mb-4" align="center" >Travel Itinerary Generator</h1>
        

        <form action="/" method="POST" class="row g-3">
          <div class="col-md-6">
            <label for="source" class="form-label">From:</label>
            <input
              type="text"
              class="form-control"
              name="source"
              id="source"
              placeholder="Enter your boarding point"
              required
            />
          </div>

          <div class="col-md-6">
            <label for="destination" class="form-label">To:</label>
            <input
              type="text"
              class="form-control"
              name="destination"
              id="destination"
              placeholder="Enter your destination"
              required
            />
          </div>

          <div class="col-md-6">
            <label for="date" class="form-label">Travel Date:</label>
            <input type="date" class="form-control" name="date" id="date" required />
          </div>

          <div class="col-md-6">
            <label for="return" class="form-label">Return Date:</label>
            <input type="date" class="form-control" name="return" id="return" required />
          </div>

          <div class="col-12 text-center">
            <button type="submit" class="btn btn-primary w-50">Submit</button>
          </div>

          <div class="d-flex justify-content-center mt-3">
            <img
              id="loading"
              style="display: none;"
              src="{{ url_for('static',filename='loading.gif') }}"
              alt="Loading..."
            />
          </div>
          
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
      <p>&copy {{now.year}} Tailored Travel</p>
    </div>
  </footer>
</div>

<script>
  document.querySelector('form').addEventListener('submit', function() {
    document.getElementById('loading').style.display = 'block';
  });
</script>

{% endblock %}
