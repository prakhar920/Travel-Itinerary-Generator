<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Itinerary</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    
    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static',filename='logo.svg') }}" />
    
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/046a1f51ad.js" crossorigin="anonymous"></script>

    <!-- Share Button CSS -->
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='share.css' ) }}" />

    <style>
      /* Custom CSS for transitions, spacing, and layout */
      .alert {
        transition: opacity 1s; /* Fade-out effect for alerts */
      }
      main {
        margin-top: 100px;
        margin-bottom: 120px;
        overflow-x: overlay;
      }
      header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1;
      }
      .navbar-nav {
        display: flex;
        flex-direction: row;
        list-style: none;
      }
      .navbar-nav li {
        padding: 0 10px;
      }
      .navbar-nav li a {
        text-decoration: none;
        color: #fff;
      }
      .nav-item {
        width: max-content;
      }
      @media (max-width: 768px) {
        main {
          margin-top: 150px;
        }
        header {
          font-size: 1rem;
          padding: 1.5rem;
          text-align: center;
        }
        header h1 {
          font-size: 1.5rem;
        }
        header nav {
          display: block;
        }
        .nav-item {
          width: auto;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg fixed-top bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="/">
            <b>Tailored Travel</b>
          </a>
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link btn btn-dark" href="http://localhost:3000/">
                <i class="fa-solid fa-house-user"></i> Home
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link btn btn-dark" href="/about">
                <i class="fa-solid fa-info"></i> About Us
              </a>
            </li>
          </ul>
          <div class="d-flex align-items-center">
            {% if session.user_name %}
            <span class="text-white">Welcome, {{ session.user_name }}</span>
            <a href="/logout" class="btn btn-primary ms-3">Logout</a>
            {% endif %}
          </div>
        </div>
      </nav>
    </header>

    {% block content %}{% endblock %}
  </body>
</html>
